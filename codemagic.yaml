workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Voyanz Amaury
    environment:
      groups:
        - voyanz_signing
      vars:
        BUNDLE_ID: com.amaury.voyanz
      flutter: 3.44.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Initialize iOS signing keychain
        script: |
          keychain initialize

      - name: Fetch or create iOS signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add iOS signing certificate
        script: |
          keychain add-certificates

      - name: Configure Xcode code signing
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze Flutter code
        script: |
          flutter analyze

      - name: Run Flutter tests
        script: |
          flutter test

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA for App Store distribution
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - syedasadullahkazmik@gmail.com
        notify:
          success: true
          failure: true
